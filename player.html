<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>مين يعرفني أكثر</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#070A0F; --panel:#0E141D; --panel2:#151D29; --line:#233044; --line2:#33455F;
  --gray:#8D9AAC; --dim:#5E6B7D; --white:#EEF3F9; --blue:#2E6BFF; --blue-hi:#6D9BFF;
  --blue-dim:#12203C; --good:#1FA463; --bad:#E23B3B; --gold:#E0A200;
  --disp:'Almarai','Segoe UI',Tahoma,sans-serif; --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--white);font-family:var(--body);font-size:16px;line-height:1.7;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow-x:hidden}
#app{min-height:100%;display:flex;flex-direction:column;padding:14px 16px 18px;gap:14px}
h1,h2,h3{font-family:var(--disp);font-weight:800;margin:0;line-height:1.35}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px;border-radius:8px}
.top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:800;font-size:14px}
.brand span{color:var(--blue-hi)}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);
  border-radius:999px;background:var(--panel);font-size:12.5px;color:var(--gray)}
.chip b{color:var(--white)}
.chip.gold{border-color:var(--gold);color:var(--gold);background:#1A1403}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px}
.note{font-size:13px;color:var(--dim)}
.lead{color:var(--gray)}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:13px 18px;font-weight:600;width:100%}
.btn-main{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--gray)}
.btn:disabled{opacity:.4}
.btn-sm{padding:8px 13px;font-size:13px;width:auto;border-radius:9px}
.field{width:100%;background:#0A101A;border:1px solid var(--line);border-radius:11px;padding:14px;color:var(--white)}
.field::placeholder{color:var(--dim)}
.field:focus{border-color:var(--blue);outline:none}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.big{font-family:var(--disp);font-weight:800;font-size:clamp(26px,8vw,40px);letter-spacing:-1px}
.tickmark{width:74px;height:74px;border-radius:50%;background:rgba(31,164,99,.16);border:2px solid var(--good);color:#5FE0A5;display:grid;place-items:center;font-size:38px;font-weight:700}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* أزرار الألوان */
.pad{flex:1;display:grid;gap:11px;grid-template-columns:1fr 1fr;min-height:62vh}
.pad.six{grid-template-rows:repeat(3,1fr)}
.pick{border:0;border-radius:18px;display:grid;place-items:center;font-size:44px;color:#fff;
  box-shadow:0 10px 26px -14px #000;transition:transform .12s;font-weight:700}
.pick:active{transform:scale(.96)}
.pick:disabled{opacity:.3}
.done{flex:1;display:grid;place-items:center;border-radius:20px;color:#fff;text-align:center;padding:24px;gap:10px}
.done .sh{font-size:74px;line-height:1}
.done .t{font-family:var(--disp);font-weight:800;font-size:22px}
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:20px;padding:26px;text-align:center}
.res.ok{background:rgba(31,164,99,.14);border:1px solid var(--good)}
.res.no{background:rgba(226,59,59,.12);border:1px solid var(--bad)}
.res .mark{font-size:62px;line-height:1}
.res .t{font-family:var(--disp);font-weight:800;font-size:26px}

/* الكتابة */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.seg button{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;text-align:center}
.seg button b{display:block;font-family:var(--disp);font-weight:800;font-size:18px}
.seg button small{color:var(--gray);font-size:11.5px}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-dim)}
.slots{display:flex;flex-direction:column;gap:9px}
.slot{display:flex;align-items:center;gap:8px}
.swatch{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:15px;color:#fff}
.mk{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;font-size:12px;color:var(--dim);font-weight:600;white-space:nowrap}
.mk[aria-pressed="true"]{background:rgba(31,164,99,.16);border-color:var(--good);color:#5FE0A5}
.poolpick{display:flex;gap:6px;flex-wrap:wrap;max-height:34vh;overflow-y:auto}
.poolpick button{font-size:13.5px;border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:7px 13px;color:var(--gray);width:auto}
.poolpick button.used{opacity:.32}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;background:var(--panel2);
  border:1px solid var(--line2);padding:10px 18px;border-radius:999px;font-size:13.5px;display:none}
.timer{height:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--blue);transition:width .12s linear}
.timer.low i{background:var(--bad)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let PID="", SV=null, lastKey="", offset=0, draft=null, prevPhase="";
try{ PID=localStorage.getItem("mya_pid")||""; }catch(e){}

async function send(action,extra){
  try{
    const r=await fetch("/act",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(Object.assign({action,pid:PID},extra||{}))});
    const j=await r.json(); if(j.error) toast(j.error); poll(); return j;
  }catch(e){ toast("انقطع الاتصال"); return {}; }
}
async function poll(){
  try{
    const r=await fetch("/state?role=player&pid="+encodeURIComponent(PID),{cache:"no-store"});
    const s=await r.json(); offset=s.now-Date.now(); SV=s;
    const key=[s.v,s.phase,s.joined,s.me?s.me.answer:""].join("|");
    if(key!==lastKey){
      const started = ["lobby","pick"].includes(prevPhase) && !["lobby","pick"].includes(s.phase);
      prevPhase=s.phase; lastKey=key; render();
      if(started && s.joined){                       // انطلقت اللعبة — نبّه اللاعب
        if(navigator.vibrate) try{navigator.vibrate([40,70,40]);}catch(e){}
        toast("بدأت اللعبة!");
      }
    }
  }catch(e){}
}
setInterval(poll,550); poll();
let tt=null;
function toast(m){ const n=$("#toast"); n.textContent=m; n.style.display="block";
  clearTimeout(tt); tt=setTimeout(()=>n.style.display="none",2200); }

function render(){
  const s=SV; if(!s) return;
  const a=document.activeElement, keep=(a&&a.id&&a.tagName==="INPUT")?{id:a.id,v:a.value,p:a.selectionStart}:null;
  $("#app").innerHTML = view();
  wire();
  if(keep){ const n=document.getElementById(keep.id); if(n){n.value=keep.v;n.focus();try{n.setSelectionRange(keep.p,keep.p);}catch(e){}} }
  paint();
}
function head(){
  const s=SV, m=s.me;
  return `<div class="top"><span class="brand">مين <span>يعرفني</span> أكثر</span><span class="sp"></span>
    ${m?`<span class="chip"><b>${esc(m.name)}</b>${s.mode==="teams"?" · "+esc(s.teams[m.team]):""}</span>
        <span class="chip">${m.score} نقطة</span>`:""}</div>`;
}

function view(){
  const s=SV;
  if(!s.joined) return vJoin();
  if(s.compose) return vCompose();
  if(s.phase==="play") return vPlay();
  if(s.phase==="reveal") return vReveal();
  if(s.phase==="end") return vEnd();
  return vWait();
}

function vJoin(){
  return `${head()}<section class="center">
    <h1 class="big">مين <span style="color:var(--blue-hi)">يعرفني</span> أكثر؟</h1>
    <p class="lead">اكتب اسمك عشان تدخل اللعبة</p>
    <input class="field" id="nm" placeholder="اسمك" autocomplete="off" maxlength="20">
    <button class="btn btn-main" id="join">دخول</button>
    <p class="note">جوالك بيصير ريموت الإجابة — ألوان بس!</p>
  </section>`;
}

function vWait(){
  const s=SV;
  if(s.isOwner && (s.phase==="owner"||s.phase==="compose"||s.phase==="ready")){
    return `${head()}<section class="center">
      <p class="chip gold">دورك</p>
      <h2 class="big" style="font-size:26px">السؤال الجاي عنك</h2>
      <p class="lead">${s.phase==="ready"?"خلّصت! انتظر الهوست يعرض السؤال.":"انتظر الهوست يرسل لك السؤال عشان تكتب الخيارات."}</p>
      <div class="spin"></div></section>`;
  }
  if(s.phase==="lobby"||s.phase==="pick"){
    return `${head()}<section class="center">
      <div class="tickmark">✓</div>
      <h2 class="big" style="font-size:26px">تم دخولك</h2>
      <p class="lead">انتظر المستضيف يختار الأسئلة…<br>أول ما يخلّص بتفتح عندك على طول</p>
      <div class="spin"></div>
      <p class="note">لا تسكّر هذي الصفحة</p></section>`;
  }
  const txt={owner:"الجولة الجاية تجهّز…",compose:"صاحب السؤال يكتب الخيارات…",
             ready:"استعد! السؤال راح يطلع الحين."}[s.phase]||"انتظر…";
  return `${head()}<section class="center"><div class="spin"></div>
    <h2 style="font-size:20px">${esc(txt)}</h2>
    <p class="note">خلّ عينك على الشاشة الكبيرة</p></section>`;
}

function vPlay(){
  const s=SV, C=s.colors, m=s.me;
  if(s.isOwner) return `${head()}<section class="center">
    <p class="chip gold">أنت صاحب السؤال</p>
    <h2 style="font-size:20px">اللاعبين يجاوبون الحين</h2>
    <p class="note">تابع الشاشة الكبيرة</p><div class="spin"></div></section>`;
  if(m.answer!==null){
    const c=C[m.answer];
    return `${head()}<div class="timer" id="tm"><i id="tf"></i></div>
      <section class="done" style="background:${c.hex}">
        <div><div class="sh">${c.shape}</div><p class="t">وصلت إجابتك</p>
        <p style="opacity:.85;font-size:14px">اخترت ${esc(c.name)} — انتظر النتيجة</p></div></section>`;
  }
  return `${head()}<div class="timer" id="tm"><i id="tf"></i></div>
    <p class="note" style="text-align:center">اختر لونك — بسرعة!</p>
    <div class="pad ${s.count===6?"six":""}">
      ${Array.from({length:s.count},(_,i)=>`
        <button class="pick" data-pick="${i}" style="background:${C[i].hex}" aria-label="${esc(C[i].name)}">${C[i].shape}</button>`).join("")}
    </div>`;
}

function vReveal(){
  const s=SV, m=s.me, C=s.colors;
  if(s.isOwner){ const c=C[s.result.correct];
    return `${head()}<section class="center">
      <p class="chip gold">سؤالك</p>
      <div class="chip" style="background:${c.hex};border-color:${c.hex};color:#fff;font-size:17px;padding:10px 18px">${c.shape} ${esc(c.name)}</div>
      <p class="lead">كانت إجابتك الصحيحة. الهوست يحسب النقاط الحين.</p></section>`; }
  if(m.answer===null) return `${head()}<section class="res no">
    <div class="mark">⏱</div><p class="t">ما لحقت</p><p class="lead">الجولة الجاية كن أسرع</p></section>`;
  const ok=m.answer===s.result.correct, c=C[s.result.correct];
  return `${head()}<section class="res ${ok?"ok":"no"}">
    <div class="mark">${ok?"✓":"✗"}</div>
    <p class="t">${ok?"صح! +"+s.result.points:"خطأ"}</p>
    <p class="lead">${ok?"تعرفه زين":"الصح كان"} <b style="color:${c.hex}">${c.shape} ${esc(c.name)}</b></p>
    <p class="note">مجموعك ${m.score} نقطة</p></section>`;
}

function vEnd(){
  const s=SV, m=s.me, pos=(s.rank||[]).indexOf(m.id)+1;
  return `${head()}<section class="center">
    <p class="chip">انتهت اللعبة</p>
    <h2 class="big">${pos===1?"👑 الأول!":"مركزك "+pos}</h2>
    <p class="lead">${m.score} نقطة${s.mode==="teams"?" · "+esc(s.teams[m.team]):""}</p>
    <p class="note">شوف الترتيب الكامل على الشاشة الكبيرة</p></section>`;
}

/* كتابة الخيارات على جوال صاحب السؤال */
function vCompose(){
  const s=SV, c=s.compose, C=s.colors;
  if(!draft) draft={count:c.count||4,options:(c.options.length?c.options.slice():["","","","","",""]),correct:c.correct};
  const d=draft, ready=d.options.slice(0,d.count).every(o=>(o||"").trim())&&d.correct!==null&&d.correct<d.count;
  return `${head()}
   <div><p class="chip gold">سؤالك — لا تخلي أحد يشوف جوالك</p>
     <h2 style="font-size:20px;margin-top:10px">${esc(c.text)}</h2>
     ${c.double?`<p class="chip gold" style="margin-top:8px">×2 دبل نقاط هالجولة</p>`:""}</div>
   <div class="panel"><p class="note" style="margin-bottom:9px">كم خيار تبي؟</p>
     <div class="seg">
       <button data-count="4" aria-pressed="${d.count===4}"><b>4</b><small>نقطة للي يجيبها</small></button>
       <button data-count="6" aria-pressed="${d.count===6}"><b>6</b><small>نقطتان للي يجيبها</small></button>
     </div></div>
   <div class="panel">
     <div class="slots">
       ${Array.from({length:d.count},(_,i)=>`
         <div class="slot"><span class="swatch" style="background:${C[i].hex}">${C[i].shape}</span>
           <input class="field" id="o${i}" data-opt="${i}" value="${esc(d.options[i]||"")}" placeholder="${esc(C[i].name)}" autocomplete="off">
           <button class="mk" data-correct="${i}" aria-pressed="${d.correct===i}">${d.correct===i?"✓":"صح"}</button>
         </div>`).join("")}
     </div>
     ${c.pool&&c.pool.length?`<p class="note" style="margin:13px 0 8px">اضغط خيار جاهز ينزل بأول خانة فاضية:</p>
       <div class="poolpick">${c.pool.map(o=>`<button data-fill="${esc(o)}" class="${d.options.includes(o)?"used":""}">${esc(o)}</button>`).join("")}</div>
       <div style="display:flex;gap:8px;margin-top:12px">
         <button class="btn btn-sm" id="fillrand">عبّيها عشوائي</button>
         <button class="btn btn-sm btn-ghost" id="clr">تفريغ</button></div>`:""}
   </div>
   <button class="btn btn-main" id="sub" ${ready?"":"disabled"}>جاهز — أرسل للشاشة</button>
   ${!ready?`<p class="note" style="text-align:center">عبّي الخانات وحدّد الصح</p>`:""}`;
}

function paint(){
  const s=SV; if(!s||s.phase!=="play") return;
  const f=document.getElementById("tf"); if(!f) return;
  const left=Math.max(0,(s.deadline-(Date.now()+offset))/1000);
  f.style.width=(left/s.seconds*100)+"%";
  document.getElementById("tm").classList.toggle("low",left<=10);
}
setInterval(paint,130);

function on(sel,fn,ev){ document.querySelectorAll(sel).forEach(n=>n.addEventListener(ev||"click",fn)); }
function grab(){ if(!draft)return; document.querySelectorAll("[data-opt]").forEach(i=>{draft.options[+i.dataset.opt]=i.value;}); }
function wire(){
  on("#join",async()=>{
    const v=$("#nm").value.trim(); if(!v){toast("اكتب اسمك");return;}
    const j=await send("join",{name:v});
    if(j&&j.pid){ PID=j.pid; try{localStorage.setItem("mya_pid",PID);}catch(e){} lastKey=""; poll(); }
  });
  on("#nm",e=>{ if(e.key==="Enter") $("#join").click(); },"keydown");
  on("[data-pick]",e=>{ const i=+e.currentTarget.dataset.pick;
    if(navigator.vibrate) try{navigator.vibrate(18);}catch(x){}
    send("answer",{index:i}); });
  on("[data-count]",e=>{ grab(); draft.count=+e.currentTarget.dataset.count;
    if(draft.correct!==null&&draft.correct>=draft.count) draft.correct=null; render(); });
  on("[data-opt]",e=>{ draft.options[+e.target.dataset.opt]=e.target.value;
    const d=draft, ok=d.options.slice(0,d.count).every(o=>(o||"").trim())&&d.correct!==null&&d.correct<d.count;
    const b=document.getElementById("sub"); if(b) b.disabled=!ok; },"input");
  on("[data-correct]",e=>{ grab(); const i=+e.currentTarget.dataset.correct;
    draft.correct=draft.correct===i?null:i; render(); });
  on("[data-fill]",e=>{ grab(); const v=e.currentTarget.dataset.fill;
    const i=draft.options.slice(0,draft.count).findIndex(o=>!(o||"").trim());
    if(i<0){toast("كل الخانات معبّاة");return;} draft.options[i]=v; render(); });
  on("#fillrand",()=>{ const p=(SV.compose.pool||[]).slice().sort(()=>Math.random()-.5);
    if(p.length<draft.count){toast("الخيارات الجاهزة أقل من العدد");return;}
    draft.options=p.slice(0,6); draft.correct=null; render(); });
  on("#clr",()=>{ draft.options=["","","","","",""]; draft.correct=null; render(); });
  on("#sub",()=>{ grab();
    send("submit_compose",{count:draft.count,options:draft.options.slice(0,draft.count),correct:draft.correct})
      .then(()=>{ draft=null; }); });
}
</script>
</body>
</html>
