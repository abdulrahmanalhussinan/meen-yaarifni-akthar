<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مين يعرفني أكثر — شاشة الهوست</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script src="/qrcode.min.js"></script>
<style>
:root{
  --ink:#070A0F; --panel:#0E141D; --panel2:#151D29; --line:#233044; --line2:#33455F;
  --gray:#8D9AAC; --dim:#5E6B7D; --white:#EEF3F9; --blue:#2E6BFF; --blue-hi:#6D9BFF;
  --blue-dim:#12203C; --good:#1FA463; --bad:#E23B3B; --gold:#E0A200;
  --disp:'Almarai','Segoe UI',Tahoma,sans-serif; --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--white);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 620px at 80% -12%,rgba(46,107,255,.17),transparent 60%),
             radial-gradient(800px 560px at 8% 110%,rgba(46,107,255,.10),transparent 62%)}
#app{position:relative;z-index:1;min-height:100%;max-width:1180px;margin-inline:auto;padding-inline:22px;padding-block:0 30px;display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--disp);font-weight:800;margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:3px;border-radius:8px}

#bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
     padding-block:14px;background:linear-gradient(var(--ink) 74%,transparent)}
.brand{font-family:var(--disp);font-weight:800;font-size:16px}
.brand span{color:var(--blue-hi)}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border:1px solid var(--line);
      border-radius:999px;background:var(--panel);font-size:13px;color:var(--gray);font-variant-numeric:tabular-nums}
.chip b{color:var(--white);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px var(--blue-dim)}
.chip.x2{border-color:var(--gold);color:var(--gold);background:#1A1403}

.screen{flex:1;display:flex;flex-direction:column;gap:20px;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--blue-hi);font-weight:600}
.lead{color:var(--gray);max-width:66ch}
.note{font-size:13px;color:var(--dim)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel-t{font-family:var(--disp);font-weight:700;font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-t .sp{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.end{margin-top:auto;padding-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:12px 20px;font-weight:600;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--blue);background:#1B2534}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn-main{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 10px 30px -12px rgba(46,107,255,.6)}
.btn-main:hover:not(:disabled){background:#3F79FF;border-color:#3F79FF}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#1A1403}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--gray)}
.btn-ghost:hover:not(:disabled){color:var(--white)}
.btn-lg{padding:16px 34px;font-size:18px;font-family:var(--disp);font-weight:800}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:9px}
.field{width:100%;background:#0A101A;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--white)}
.field::placeholder{color:var(--dim)}
.field:focus{border-color:var(--blue);outline:none}

/* لوبي */
.qr-card{background:#fff;border-radius:18px;padding:10px;display:grid;place-items:center;width:max-content;margin-inline:auto}
.qr-card svg{display:block;width:min(340px,52vw);height:auto;image-rendering:pixelated}
.url{font-family:var(--body);font-size:17px;color:var(--blue-hi);direction:ltr;letter-spacing:.4px;text-align:center;word-break:break-all}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
.pcard{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.pav{width:30px;height:30px;flex:none;border-radius:9px;background:var(--blue-dim);color:var(--blue-hi);display:grid;place-items:center;font-weight:700;font-size:14px}
.pname{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.tsw button{border:0;background:transparent;color:var(--gray);padding:4px 9px;font-size:12px;font-weight:600}
.tsw button[aria-pressed="true"]{background:var(--blue);color:#fff}
.x{border:0;background:transparent;color:var(--dim);font-size:19px;line-height:1;padding:2px 7px;border-radius:8px}
.x:hover{color:var(--bad);background:#1D1216}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:right;border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:13px 15px}
.mode b{display:block;font-family:var(--disp);font-weight:700}
.mode small{color:var(--gray);font-size:12.5px}
.mode[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-dim)}

/* اختيار الأسئلة */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tab{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 15px;font-size:14px;color:var(--gray);display:flex;gap:7px;align-items:center}
.tab[aria-pressed="true"]{background:var(--blue-dim);border-color:var(--blue);color:var(--white);font-weight:600}
.tab i{font-style:normal;font-size:11px;background:var(--panel2);border-radius:99px;padding:1px 7px;color:var(--blue-hi)}
.qlist{display:flex;flex-direction:column;gap:8px;max-height:min(48vh,460px);overflow-y:auto;padding-inline-end:5px}
.qlist::-webkit-scrollbar{width:9px}.qlist::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.qitem{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:12px 14px;text-align:right;width:100%;transition:.14s}
.qitem:hover{border-color:var(--line2)}
.qitem[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-dim)}
.qhead{display:flex;align-items:center;gap:11px}
.tick{width:21px;height:21px;flex:none;border:1.5px solid var(--line2);border-radius:7px;display:grid;place-items:center;font-size:12px;color:transparent}
.qitem[aria-pressed="true"] .tick{background:var(--blue);border-color:var(--blue);color:#fff}
.qtxt{flex:1;font-weight:500}
.pool{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;padding-inline-start:32px}
.pchip{font-size:11.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.pmore{font-size:11.5px;color:var(--blue-hi)}

/* الكتابة */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:14px;text-align:center}
.seg button b{display:block;font-family:var(--disp);font-weight:800;font-size:20px}
.seg button small{color:var(--gray);font-size:12.5px}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-dim)}
.slots{display:flex;flex-direction:column;gap:9px}
.slot{display:flex;align-items:center;gap:9px}
.swatch{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:16px;color:#fff;font-weight:700}
.mark{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--dim);font-weight:600;white-space:nowrap}
.mark[aria-pressed="true"]{background:rgba(31,164,99,.16);border-color:var(--good);color:#5FE0A5}
.poolpick{display:flex;gap:6px;flex-wrap:wrap;max-height:180px;overflow-y:auto}
.poolpick button{font-size:13.5px;border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:6px 13px;color:var(--gray)}
.poolpick button:hover{border-color:var(--blue);color:var(--white)}
.poolpick button.used{opacity:.35}

/* اللعب */
.timer{display:flex;align-items:center;gap:16px}
.tnum{font-family:var(--disp);font-weight:800;font-size:44px;min-width:2.6ch;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1.5px}
.rail{flex:1;height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--blue);transition:width .12s linear}
.low .rail i{background:var(--bad)}
.low .tnum{color:var(--bad);animation:pul 1s infinite}
@keyframes pul{50%{opacity:.4}}
.qbig{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,3.4vw,34px);position:relative;overflow:hidden}
.qbig::after{content:"";position:absolute;inset-inline-start:-50px;top:-70px;width:260px;height:260px;background:radial-gradient(circle,rgba(46,107,255,.30),transparent 70%)}
.qbig h2{font-size:clamp(26px,4.4vw,44px);position:relative}
.about{font-size:15px;color:var(--gray);margin-bottom:10px;position:relative}
.about b{color:var(--blue-hi);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.opt{display:flex;align-items:center;gap:13px;border-radius:14px;padding:16px 18px;color:#fff;font-weight:600;font-size:clamp(16px,2vw,21px);border:2px solid transparent;transition:.25s}
.opt .sh{font-size:20px;opacity:.9}
.opt.dim{opacity:.25;filter:grayscale(.5)}
.opt.win{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.14)}
.opt .tag{margin-inline-start:auto;font-size:12.5px;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 10px}
.hintbar{display:flex;gap:10px;background:var(--blue-dim);border:1px solid #2A4478;border-radius:13px;padding:12px 16px}
.hintbar b{color:var(--blue-hi);flex:none}
.answered{display:flex;gap:9px;flex-wrap:wrap}
.abub{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:5px 13px;font-size:13.5px;color:var(--gray)}
.abub.in{border-color:var(--blue);background:var(--blue-dim);color:var(--white)}

/* الكشف */
.judge{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.jcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:11px 13px;text-align:right}
.jcard[data-ok="1"]{border-color:var(--good);background:rgba(31,164,99,.10)}
.jcard[data-ok="0"]{opacity:.62}
.jdot{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:13px;color:#fff}
.jname{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jname small{display:block;color:var(--dim);font-size:11.5px}
.jpts{font-family:var(--disp);font-weight:800;font-variant-numeric:tabular-nums;color:var(--dim)}
.jcard[data-ok="1"] .jpts{color:#5FE0A5}

/* الترتيب */
.stand{display:flex;flex-direction:column;gap:9px}
.srow{display:flex;align-items:center;gap:13px;border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:13px 16px}
.srow.top{border-color:var(--blue);background:linear-gradient(90deg,var(--blue-dim),var(--panel))}
.rank{width:30px;height:30px;flex:none;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--gray)}
.srow.top .rank{background:var(--blue);border-color:var(--blue);color:#fff}
.sname{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spts{font-family:var(--disp);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.spts small{font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--dim);margin-inline-start:4px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.tcard{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:20px;text-align:center}
.tcard.win{border-color:var(--blue);box-shadow:0 14px 50px -26px rgba(46,107,255,.8)}
.tcard .tn{font-family:var(--disp);font-weight:700}
.tcard .tp{font-family:var(--disp);font-weight:800;font-size:44px;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.winline{font-family:var(--disp);font-weight:800;font-size:clamp(28px,5vw,46px);color:var(--blue-hi);text-align:center}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:26px}
.big-owner{font-family:var(--disp);font-weight:800;font-size:clamp(34px,7vw,64px);color:var(--blue-hi);letter-spacing:-1.5px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.veil{position:fixed;inset:0;z-index:60;background:rgba(3,6,11,.85);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:22px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:70;background:var(--panel2);border:1px solid var(--line2);padding:11px 20px;border-radius:999px;font-size:14px;display:none}
@media (max-width:820px){.grid2,.modes,.seg,.opts,.vs{grid-template-columns:1fr}.tnum{font-size:34px}}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <span class="brand">مين <span>يعرفني</span> أكثر</span>
    <span class="sp"></span>
    <span class="chip" id="c-round" style="display:none"><i class="dot"></i>الجولة <b id="rn">1</b> / <b id="rt">10</b></span>
    <span class="chip x2" id="c-x2" style="display:none">×2 دبل نقاط</span>
    <span class="chip" id="c-score" style="display:none"></span>
    <button class="btn btn-sm btn-ghost" id="b-end" style="display:none">إنهاء اللعبة</button>
  </header>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
const $  = s => document.querySelector(s);
const esc = t => String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let SV=null, lastV=-1, lastPhase="", offset=0;
let picked=[], tab=0, draft=null, modal=null, customPool=[], urlIx=0;

/* ── الاتصال ── */
async function send(action, extra){
  try{
    const r = await fetch("/act",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(Object.assign({action},extra||{}))});
    const j = await r.json();
    if(j.error) toast(j.error);
    poll();
    return j;
  }catch(e){ toast("انقطع الاتصال بالخادم"); }
}
async function poll(){
  try{
    const r = await fetch("/state?role=host",{cache:"no-store"});
    const s = await r.json();
    offset = s.now - Date.now();
    SV = s;
    if(s.v!==lastV || s.phase!==lastPhase){ lastV=s.v; lastPhase=s.phase; render(); }
  }catch(e){}
}
setInterval(poll,700); poll();

let toastT=null;
function toast(m){ const n=$("#toast"); n.textContent=m; n.style.display="block";
  clearTimeout(toastT); toastT=setTimeout(()=>n.style.display="none",2200); }

/* ── الرسم ── */
function render(){
  const s=SV; if(!s) return;
  const playing = !["lobby","pick"].includes(s.phase);
  $("#c-round").style.display = (playing && s.phase!=="end") ? "" : "none";
  $("#b-end").style.display   = (playing && s.phase!=="end") ? "" : "none";
  $("#c-x2").style.display    = (playing && s.q && s.q.double && s.phase!=="end") ? "" : "none";
  $("#rn").textContent = Math.min(s.round+1, s.total);
  $("#rt").textContent = s.total;
  const sc=$("#c-score");
  if(playing && s.mode==="teams"){ sc.style.display="";
    sc.innerHTML = esc(s.teams[0])+" <b>"+s.teamScores[0]+"</b> — <b>"+s.teamScores[1]+"</b> "+esc(s.teams[1]);
  } else if(playing && s.players.length){
    const t=[...s.players].sort((a,b)=>b.score-a.score)[0];
    sc.style.display = t && t.score>0 ? "" : "none";
    if(t) sc.innerHTML = "المتصدر <b>"+esc(t.name)+"</b> · "+t.score;
  } else sc.style.display="none";

  const keep = saveFocus();
  $("#main").innerHTML = ({lobby:vLobby,pick:vPick,owner:vOwner,compose:vCompose,
                           ready:vReady,play:vPlay,reveal:vReveal,end:vEnd}[s.phase]||vLobby)()
                        + (modal ? mView() : "");
  wire(); restoreFocus(keep);
  if(s.phase==="lobby") drawQR();
  paintTimer();
}
function saveFocus(){ const a=document.activeElement;
  if(a && a.id && (a.tagName==="INPUT")) return {id:a.id,val:a.value,st:a.selectionStart}; return null; }
function restoreFocus(k){ if(!k) return; const n=document.getElementById(k.id);
  if(n){ n.value=k.val; n.focus(); try{n.setSelectionRange(k.st,k.st);}catch(e){} } }

/* ── 1) اللوبي ── */
function vLobby(){
  const s=SV, teams=s.mode==="teams";
  return `<section class="screen">
   <div style="padding-block:14px 0">
     <p class="eyebrow">شغّل الباركود على الشاشة الكبيرة</p>
     <h1 style="font-size:clamp(30px,5vw,46px);margin-top:6px">مين <span style="color:var(--blue-hi)">يعرفني</span> أكثر؟</h1>
     <p class="lead" style="margin-top:8px">كل واحد يمسح الباركود من جواله ويدخل اسمه. لازم الجميع على نفس شبكة الواي فاي.</p>
   </div>
   <div class="grid2">
     <div class="panel">
       <p class="panel-t">ادخلوا من جوالاتكم</p>
       <div class="qr-card" id="qr"></div>
       <p class="url" style="margin-top:14px">${esc(curUrl())}</p>
       <p class="note" style="text-align:center;margin-top:4px">افتحوا كاميرا الجوال ووجّهوها للباركود — أو اكتبوا الرابط بالمتصفح</p>
       ${(s.joinUrls||[]).length>1?`
         <p class="note" style="text-align:center;margin-top:14px">الباركود ما فتح؟ جهازك فيه أكثر من شبكة — جرّبوا عنوانًا ثانيًا:</p>
         <div class="row" style="justify-content:center;margin-top:8px">
           ${s.joinUrls.map((u,i)=>`<button class="chip" data-url="${i}" style="cursor:pointer;${i===urlIx?'background:var(--blue);border-color:var(--blue);color:#fff':''}">${esc(u.replace("http://","").replace("/p",""))}</button>`).join("")}
         </div>`:""}
     </div>
     <div style="display:flex;flex-direction:column;gap:16px">
       <div class="panel">
         <p class="panel-t">طريقة اللعب</p>
         <div class="modes">
           <button class="mode" data-mode="solo" aria-pressed="${!teams}"><b>فردي</b><small>كل واحد ونقاطه</small></button>
           <button class="mode" data-mode="teams" aria-pressed="${teams}"><b>فريقين</b><small>النقاط تتجمع للفريق</small></button>
         </div>
         ${teams?`<div class="row" style="margin-top:12px">
           <input class="field" id="tn0" style="flex:1;min-width:150px" value="${esc(s.teams[0])}" placeholder="اسم الفريق الأول">
           <input class="field" id="tn1" style="flex:1;min-width:150px" value="${esc(s.teams[1])}" placeholder="اسم الفريق الثاني">
           <button class="btn btn-sm" id="savenames">حفظ الأسماء</button>
         </div>`:""}
       </div>
       <div class="panel">
         <p class="panel-t">اللاعبون <span class="chip"><i class="dot"></i><b>${s.players.length}</b></span><span class="sp"></span>

function curUrl(){

function drawQR(){
  const box=$("#qr"), url=curUrl();
  if(!box||!url||!window.qrcode) return;
  try{

/* ── المؤقت ── */
function paintTimer(){
  const n=document.getElementById("tnum"); if(!n||!SV||SV.phase!=="play") return;
  const left=Math.max(0,(SV.deadline-(Date.now()+offset))/1000);
  n.textContent=Math.ceil(left);
  document.getElementById("tfill").style.width=(left/SV.seconds*100)+"%";
  document.getElementById("twrap").classList.toggle("low",left<=10);
  if(left<=0 && SV.phase==="play"){ SV.phase="revealing"; send("reveal"); }
  else if(SV.answered>=SV.eligible && SV.eligible>0 && SV.phase==="play"){ SV.phase="revealing"; setTimeout(()=>send("reveal"),600); }
}
setInterval(paintTimer,120);

/* ── الأحداث ── */
function on(sel,fn,ev){ document.querySelectorAll(sel).forEach(n=>n.addEventListener(ev||"click",fn)); }
function wire(){
  // لوبي
  on(".mode",e=>send("set_mode",{mode:e.currentTarget.dataset.mode}));
  on("#savenames",()=>{ send("set_team_name",{i:0,name:$("#tn0").value});
                        setTimeout(()=>send("set_team_name",{i:1,name:$("#tn1").value}),90); });
  on("[data-team]",e=>send("set_team",{pid:e.currentTarget.dataset.pid,team:e.currentTarget.dataset.team}));
  on("[data-kick]",e=>send("kick",{pid:e.currentTarget.dataset.kick}));
  on("#addlocal",()=>{ const v=$("#localname").value.trim(); if(v){ send("add_local",{name:v}); $("#localname").value=""; } });
  on("#localname",e=>{ if(e.key==="Enter") $("#addlocal").click(); },"keydown");
  on("[data-url]",e=>{ urlIx=+e.currentTarget.dataset.url; render(); });
  on("#gopick",()=>send("goto_pick"));
  on("#tolobby",()=>send("back_lobby"));

  // اختيار الأسئلة
  on(".tab",e=>{ tab=+e.currentTarget.dataset.tab; render(); });
  on(".qitem",e=>{ const c=+e.currentTarget.dataset.c,q=+e.currentTarget.dataset.q;
    const i=picked.findIndex(p=>!p.custom&&p.c===c&&p.q===q);
    if(i>=0) picked.splice(i,1); else picked.push({c,q});
    render(); });
  on("#rand10",()=>{ const all=[]; BANK.cats.forEach((c,ci)=>c.questions.forEach((q,qi)=>all.push({c:ci,q:qi})));
    picked=picked.filter(p=>p.custom).concat(all.sort(()=>Math.random()-.5).slice(0,10)); render(); });
  on("#clrpick",()=>{ picked=[]; render(); });
  on("#addpool",()=>{ const v=$("#cp").value.trim(); if(v){ customPool.push(v); $("#cp").value=""; render(); } });
  on("#cp",e=>{ if(e.key==="Enter"){e.preventDefault();$("#addpool").click();} },"keydown");
  on("[data-rmpool]",e=>{ customPool.splice(+e.currentTarget.dataset.rmpool,1); render(); });
  on("#addcustom",()=>{ const t=$("#cq").value.trim(); if(!t){toast("اكتب السؤال أول");return;}
    picked.push({custom:true,text:t,pool:customPool.slice()}); customPool=[]; render(); });
  on("[data-rmcustom]",e=>{ const t=e.currentTarget.dataset.rmcustom;
    const i=picked.findIndex(p=>p.custom&&p.text===t); if(i>=0)picked.splice(i,1); render(); });
  on("#startgame",()=>send("start",{picks:picked}));

  // صاحب السؤال
  on("[data-owner]",e=>send("set_owner",{pid:e.currentTarget.dataset.owner}));
  on("#dbl",()=>send("toggle_double"));
  on("#sendphone",()=>{ draft=null; send("send_compose",{where:"phone"}); });
  on("#composehere",()=>{ draft=null; send("send_compose",{where:"host"}); });
  on("#backowner",()=>{ draft=null; send("back_owner"); });

  // الكتابة على شاشة الهوست
  on("[data-count]",e=>{ draft.count=+e.currentTarget.dataset.count;
    if(draft.correct!==null&&draft.correct>=draft.count) draft.correct=null; render(); });
  on("[data-opt]",e=>{ draft.options[+e.target.dataset.opt]=e.target.value; syncReady(); },"input");
  on("[data-correct]",e=>{ grab(); const i=+e.currentTarget.dataset.correct;
    draft.correct = draft.correct===i?null:i; render(); });
  on("[data-fill]",e=>{ grab(); const v=e.currentTarget.dataset.fill;
    const i=draft.options.slice(0,draft.count).findIndex(o=>!o.trim());
    if(i<0){toast("كل الخانات معبّاة");return;} draft.options[i]=v; render(); });
  on("#fillrand",()=>{ const pool=(SV.q.pool||[]).slice().sort(()=>Math.random()-.5);
    if(pool.length<draft.count){toast("الخيارات الجاهزة أقل من العدد المطلوب");return;}
    draft.options=pool.slice(0,6); draft.correct=null; render(); });
  on("#clearopts",()=>{ draft.options=["","","","","",""]; draft.correct=null; render(); });
  on("#submitc",()=>{ grab();
    send("submit_compose",{count:draft.count,options:draft.options.slice(0,draft.count),correct:draft.correct}); });

  // اللعب
  on("#startround",()=>send("start_round"));
  on("#hint",()=>{ modal="hint"; render(); });
  on("#hintok",()=>{ const v=$("#hinttext").value.trim(); modal=null; if(v) send("hint",{text:v}); else render(); });
  on("#hinttext",e=>{ if(e.key==="Enter") $("#hintok").click(); },"keydown");
  on("#hintno",()=>{ modal=null; render(); });
  on("#reveal",()=>send("reveal"));

  // الكشف
  on("[data-judge]",e=>send("toggle_correct",{pid:e.currentTarget.dataset.judge}));
  on("#next",()=>send("next"));

  // عام
  on("#again",()=>{ picked=[]; customPool=[]; draft=null; send("again"); });
  on("#newgame",()=>{ picked=[]; customPool=[]; draft=null; send("new_game"); });
  on("#endok",()=>{ modal=null; send("end_now"); });
  on("#endno",()=>{ modal=null; render(); });
}
function grab(){ document.querySelectorAll("[data-opt]").forEach(i=>{draft.options[+i.dataset.opt]=i.value;}); }
function syncReady(){ if(!draft) return;
  const ok=draft.options.slice(0,draft.count).every(o=>o.trim())&&draft.correct!==null&&draft.correct<draft.count;
  const b=document.getElementById("submitc"); if(b) b.disabled=!ok; }
$("#b-end").addEventListener("click",()=>{ modal="end"; render(); });
</script>
</body>
</html>
